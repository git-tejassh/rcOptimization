# Embodied-carbon factors, scope A1-A4 (cradle-to-site) for frame materials. Formwork carbon EXCLUDED (flagged).
# Cement and steel factors come from Indian secondary sources (status: secondary_source, not an EPD); cement content per grade,
# other constituents and transport are still PROVISIONAL. See docs/CARBON_DATA_AUDIT.md.
scope: A1-A4
cement:
  default: PPC          # Portland Pozzolana Cement is the dominant cement in Indian RCC practice
  OPC: {value: 0.92, unit: kgCO2e/kg, source: "India OPC range 893-940 kg CO2/t cement, five zones (Indian OPC/blended-cement study, secondary source; mid-value)", confidence: medium, india_specific: true, status: secondary_source}
  PSC: {value: 0.312, unit: kgCO2e/kg, source: "India PSC about 312 kg CO2/t cement (59 % below OPC; Indian OPC / blended-cement study via CEEW/GCCA India; secondary source)", confidence: medium, india_specific: true, status: secondary_source}
  PPC: {value: 0.507, unit: kgCO2e/kg, source: "India PPC about 507 kg CO2/t cement (31 % below OPC; same study via CEEW/GCCA India reporting; secondary source)", confidence: medium, india_specific: true, status: secondary_source}
cement_content_kg_m3:       # typical mix designs (IS 10262 style); IS 456 Table 5 minimum 300-340 kg/m3
  M20: {value: 330, source: "typical mix; no source", status: provisional}
  M25: {value: 360, source: "typical mix; no source", status: provisional}
  M30: {value: 390, source: "typical mix; no source", status: provisional}
  M35: {value: 420, source: "typical mix; no source", status: provisional}
  M40: {value: 450, source: "typical mix; no source", status: provisional}
concrete_other_kgCO2e_m3:   # aggregates, water, admixture, batching
  value: 12.0
  confidence: low
  india_specific: false
  source: "assumed (aggregates ~1850 kg/m3 x ~0.005-0.0075 kgCO2e/kg); no source"
  status: provisional
steel:
  Fe500: {value: 2.5, unit: kgCO2e/kg, source: "India steel sector 2.55 tCO2/t crude steel (CEEW); major producers 2.53 and other producers 2.02 tCO2/t in 2023-24; 2.5 used for TMT rebar, A1-A3 crude-steel basis (secondary source)", confidence: medium, india_specific: true, status: secondary_source}
  Fe415: {value: 2.5, unit: kgCO2e/kg, source: "same as Fe500 (no grade-specific factor exists; the production route, not the grade, drives the factor)", confidence: medium, india_specific: true, status: secondary_source}
transport_A4:
  concrete: {distance_km: 30,  factor_kgCO2e_per_t_km: 0.11, source: "assumed ready-mix plant 30 km; factor approx. rigid HGV (unverified)", status: provisional}
  steel:    {distance_km: 500, factor_kgCO2e_per_t_km: 0.11, source: "assumed mill-to-Bhopal 500 km; unverified", status: provisional}
concrete_density_kg_m3: 2400
steel_density_kg_m3: 7850
