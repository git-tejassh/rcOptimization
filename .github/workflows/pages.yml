# Publishes the static dashboard (web/dist) to GitHub Pages on every push to main.
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The static site has no Python server: the Live evaluator, the strength review and "Optimise with my prices" are switched off there
# (they explain why); everything else works. For those features run `python -m rcopt.cli serve` (docs/DEPLOY.md).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: {path: web/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
